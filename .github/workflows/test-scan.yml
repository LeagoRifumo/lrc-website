name: Scanner branch test (temporary)
on:
  push:
    branches: [claude/scanner]
    paths: [agents/tools/scanner.py, agents/tools/scan_engine.py, .github/workflows/test-scan.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 agents/tools/scanner.py
      - run: python3 agents/tools/build_articles.py
      - run: |
          git config user.name "LRC Automation"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/scan docs/sitemap.xml agents/work && git commit -q -m "Scanner test output" && git push -q origin HEAD:claude/scanner
