name: Scanner branch test (temporary)
on:
  push:
    branches: [claude/scanner-v7]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 agents/tools/scanner.py
      - run: python3 agents/tools/company_intel.py
      - run: |
          git config user.name "LRC Automation"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data agents/work && git commit -q -m "Scanner test output [skip ci]" && git push -q origin HEAD:claude/scanner-v7
