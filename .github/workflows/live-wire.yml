# LRC Live — every 15 minutes: breaking-news wire, live prices for every scanned company, and the live market dashboard (one push)
name: Live wire, prices & dashboard (every 15 min)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lrc-push
  cancel-in-progress: false
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Read the newsrooms
        run: python agents/tools/wire.py
      - name: Live prices for every company in the scanner
        continue-on-error: true
        run: python agents/tools/quotes_live.py
      - name: Live market dashboard
        continue-on-error: true
        run: python agents/tools/dashboard_auto.py
      - name: Publish
        run: bash agents/tools/publish.sh "Live update"
