# Financial statements (income statement, balance sheet, cash flow; annual 5+ years and quarterly / interim) for every company in the LRC Stock Scanner.
# Runs daily and refreshes each company about once a week (oldest first). Older years are kept, so the history only grows.
name: Financial statements
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lrc-push
  cancel-in-progress: false
jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python agents/tools/statements.py --per-run 1000
      - name: Company pages for search engines (docs/shares) + sitemap
        continue-on-error: true
        run: python agents/tools/company_pages.py
      - run: bash agents/tools/publish.sh "Financial statements"
