name: Scanner test run (temporary)
on:
  push:
    branches: [claude/scanner]
    paths: [agents/tools/scanner.py, agents/tools/scan_engine.py, agents/tools/yahoo.py, .github/workflows/probe.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scanner on a sample
        env: { SCAN_DEBUG: "NVDA,NPN.JO,CFR.JO,BTI.JO,CPI.JO" }
        run: python3 agents/tools/scanner.py
      - name: Sizes and samples
        run: |
          du -sh docs/data/scan; ls docs/data/scan/t | wc -l; head -c 1500 docs/data/scan/sectors.json; echo; head -c 1200 docs/data/scan/etfs.json
          python3 -c "import json; print(json.load(open('agents/work/us_universe.json'))[:20], len(json.load(open('agents/work/us_universe.json'))))"
