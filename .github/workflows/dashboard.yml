# Market dashboard (live) — every hour from 06:17 to 22:17 SAST on weekdays. The end-of-week snapshot is still saved by daily.yml.
name: Market dashboard (hourly)
on:
  schedule:
    - cron: '17 4-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lrc-push
  cancel-in-progress: false
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python agents/tools/dashboard_auto.py
      - run: bash agents/tools/publish.sh "Market dashboard"
