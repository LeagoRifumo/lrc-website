# Market dashboard — manual run only. The live dashboard now updates every 15 minutes inside live-wire.yml; the end-of-week snapshot is saved by daily.yml.
name: Market dashboard (hourly)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lrc-push
  cancel-in-progress: false
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python agents/tools/dashboard_auto.py
      - run: bash agents/tools/publish.sh "Market dashboard"
