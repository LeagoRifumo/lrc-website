name: fs probe
on:
  push:
    branches: [fs-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python agents/tools/statements.py --probe AAPL,JPM,NPN.JO,SBK.JO,GLN.JO,MTN.JO
