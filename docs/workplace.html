<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LRC Workplace | Leago Rifumo Capital</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a private trading-floor workplace, calm and exact.
   IDEA: the desk's morning sheet: one board per job, red when news hits a live trade.
   PICTURE: the Today board (countdown to the US open, red flags, live trades) is the first screen.
   COLOUR and TYPE: LRC green and brass on paper white; red reserved for market-moving news. Archivo + IBM Plex.
   LAYOUT: left menu (top bar on phones), one working board at a time. */
:root{
  --bg:#f6f3ea; --surface:#ffffff; --surface-2:#efe9da; --ink:#17140c; --muted:#6b6455; --line:#e2d9c3;
  --accent:#9a7417; --accent-ink:#ffffff; --brass:#b8891f;
  --buy:#17734a; --buy-bg:#e0f1e6; --sell:#b3302a; --sell-bg:#f8e1dc;
  --warn:#8d6100; --warn-bg:#f6ebcb; --live:#22539f; --live-bg:#e0e8f7;
  --red:#c42b1c; --red-bg:#fde4e0;
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px; color-scheme:light;
}
:root[data-theme="dark"]{--bg:#07080C;--surface:#121622;--surface-2:#181D2B;--ink:#E9E3D4;--muted:#9AA1B2;--line:#262c3d;--accent:#D9A93E;--accent-ink:#141006;--brass:#D9A93E;
  --buy:#3BB97A;--buy-bg:rgba(47,163,107,.16);--sell:#F0645E;--sell-bg:rgba(227,38,43,.15);--warn:#E8B64C;--warn-bg:rgba(232,182,76,.14);--live:#7EA7F2;--live-bg:rgba(126,167,242,.15);--red:#ff5b4f;--red-bg:#3a1210;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:38px;height:38px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 14px var(--font-display);letter-spacing:.04em;flex:none}
.brand b{font:800 16px var(--font-display);display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.nav .soon{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.count{background:var(--brass);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-family:var(--font-mono)}
.count.red{background:var(--red)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.me b{color:var(--ink)}
main{padding:24px clamp(16px,3vw,36px) 60px;max-width:1240px;width:100%}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{white-space:nowrap;flex:none;min-width:max-content}
  .me{margin:0;border:0;padding:0 6px;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
}

/* Controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--sell)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){.row2,.row3{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:8px 6px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line);color:var(--muted)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface-2);color:var(--ink)}
.seg label:has(input[value="Buy"]:checked){background:var(--buy-bg);color:var(--buy)}
.seg label:has(input[value="Sell"]:checked){background:var(--sell-bg);color:var(--sell)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.checks label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.buy{background:var(--buy-bg);color:var(--buy)} .pill.sell{background:var(--sell-bg);color:var(--sell)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.live{background:var(--live-bg);color:var(--live)}
.pill.red{background:var(--red);color:#fff}
.pill.accent{background:color-mix(in srgb,var(--brass) 18%,var(--surface));color:var(--brass)}
.pill.outline{background:none;border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.note{border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--sell-bg);color:var(--sell)} .note.good{background:var(--buy-bg);color:var(--buy)}
.subtle{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:32px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(26px,3.2vw,34px);font-weight:800;line-height:1.05}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{font-size:13px;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-top:6px}

/* Sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .panel{width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:24px}
.gate form{display:flex;flex-direction:column;gap:14px}

/* Today */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:980px){.hero{grid-template-columns:1fr}}
.clock{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
.clock .lab{font-size:13px;opacity:.85}
.clock .big{font:500 clamp(40px,6vw,64px)/1 var(--font-mono);letter-spacing:-.02em}
.clock .times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}
.clock .times span{display:block;font-size:12px;opacity:.85}
.clock .times b{font:500 18px var(--font-mono)}
.redbox{border-radius:var(--radius);border:2px solid var(--red);background:var(--red-bg);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.redbox h2{color:var(--red);font-size:18px}
.calm{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);padding:16px 18px}
.flag{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.flag.amber{border-left-color:var(--warn)}
.flag.cleared{border-left-color:var(--line);opacity:.75}
.flag-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag-h b{font-family:var(--font-mono)}
.flag p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left}
button.tile{cursor:pointer}
button.tile:hover{border-color:var(--muted)}
.tile span{font-size:12.5px;color:var(--muted);display:block}
.tile b{display:block;font:500 26px var(--font-mono);margin-top:2px}
.tile small{color:var(--muted);font-size:12.5px}

/* Desk */
.deskbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;border-top:3px solid var(--line)}
.stage b{display:block;font:500 22px var(--font-mono)}
.stage span{font-size:12.5px;color:var(--muted)}
.stage.accent{border-top-color:var(--brass)} .stage.warn{border-top-color:var(--warn)} .stage.buy{border-top-color:var(--buy)} .stage.live{border-top-color:var(--live)} .stage.sell{border-top-color:var(--sell)}
@media (max-width:820px){.pipeline{grid-template-columns:repeat(3,1fr)}}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;border-left:4px solid var(--line)}
.idea.t-accent{border-left-color:var(--brass)} .idea.t-warn{border-left-color:var(--warn)} .idea.t-buy{border-left-color:var(--buy)} .idea.t-live{border-left-color:var(--live)} .idea.t-sell{border-left-color:var(--sell)}
.idea.hot{border-left-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.idea-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px 4px}
.idea-h .asset{font:500 18px var(--font-mono);margin-right:4px}
.idea-meta{padding:0 16px 10px;color:var(--muted);font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap}
.halves{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.half{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.half+.half{border-left:1px solid var(--line)}
@media (max-width:760px){.halves{grid-template-columns:1fr}.half+.half{border-left:0;border-top:1px solid var(--line)}}
.half h3{font:600 12.5px var(--font-body);color:var(--muted)}
.thesis{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 14px;margin:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.levels{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.levels div{padding:7px 10px;border-right:1px solid var(--line)}
.levels div:last-child{border-right:0}
.levels span{display:block;font-size:12px;color:var(--muted)}
.levels b{font:500 14px var(--font-mono);white-space:nowrap}
.locked{color:var(--muted);font-size:14px;background:var(--surface-2);border-radius:8px;padding:14px;border:1px dashed var(--line)}
.verdict{border-radius:8px;padding:10px 12px;font-size:14px}
.verdict.ok{background:var(--buy-bg);color:var(--buy)} .verdict.no{background:var(--sell-bg);color:var(--sell)} .verdict.wait{background:var(--warn-bg);color:var(--warn)}
.verdict ul{margin:6px 0 0;padding-left:18px}
.outcome{padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:14px;display:flex;gap:6px 16px;flex-wrap:wrap}
.idea-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.idea-f .acts{display:flex;gap:6px;flex-wrap:wrap}
details.hist summary{cursor:pointer;color:var(--muted);font-size:13px}
details.hist ol{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* Active trades */
.meter{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--sell-bg),var(--surface-2) 33%,var(--buy-bg));margin:18px 0 6px}
.meter i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.meter em{position:absolute;top:-5px;width:2px;height:20px;background:var(--muted);opacity:.6}
.meterlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Tables */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tbl-title{padding:12px 14px 4px;font:600 15px var(--font-display)}
.pos{color:var(--buy)} .neg{color:var(--sell)}
.coming{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.coming .panel h3{font-size:16px;margin-bottom:6px}
.coming ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* Modal */
#modal:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:20}
.dialog{position:fixed;z-index:21;left:50%;top:4vh;transform:translateX(-50%);width:min(640px,calc(100% - 24px));max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog.wide{width:min(820px,calc(100% - 24px))}
.dialog header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog header h2{font-size:19px}
.dialog .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form-error:empty{display:none}
.handover-sum{background:var(--surface-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#stage{position:fixed;inset:0;z-index:50;background:#050807;color:#f4f6f5;display:flex;flex-direction:column}
.stage-bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0e1412;flex-wrap:wrap}
.stage-bar .btn{background:#1c2622;color:#e5ebe7;border-color:#2a3631}.stage-bar .btn.primary{background:#5cb391;color:#0a120f}
.prompter{flex:1;overflow-y:auto;padding:8vh 8vw;font:600 clamp(28px,4.4vw,56px)/1.35 var(--font-body)}
.prompter h2{font:800 clamp(20px,2.4vw,30px) var(--font-display);color:#d6a447;margin:1.2em 0 .4em}
.prompter p{margin:0 0 .8em}
.slide{flex:1;display:flex;flex-direction:column;background:linear-gradient(135deg,#07100d,#13241d);padding:clamp(16px,3vw,40px)}
.slide-top,.slide-foot{display:flex;gap:12px;align-items:center;color:#97a59e;font-size:16px;flex-wrap:wrap}
.slide-mark{background:#1d5a48;color:#fff;font:800 16px var(--font-display);padding:6px 10px;border-radius:6px}
.slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:1200px;width:100%;margin:0 auto;font-size:clamp(18px,2.4vw,32px)}
.slide-body h2{font:900 clamp(30px,5vw,64px)/1.05 var(--font-display);color:#ffd23f}
.slide-body .tblwrap,.slide-body table{background:transparent;border-color:#2a3631;color:#f4f6f5;font-size:clamp(14px,1.8vw,24px)}
.slide-body th{background:#1c2622;color:#97a59e}.slide-body td{border-color:#2a3631}
.slide-body .levels{border-color:#2a3631}.slide-body .levels div{border-color:#2a3631;padding:14px}.slide-body .levels b{font-size:clamp(20px,3vw,40px)}.slide-body .levels span{color:#97a59e;font-size:clamp(12px,1.3vw,18px)}
.slide-foot .btn{background:#1c2622;color:#e5ebe7;border-color:#2a3631}.slide-foot .btn.primary{background:#5cb391;color:#0a120f}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:4px}
.cal-h{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:2px 0}
.cal-c{min-height:72px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.cal-c b{font-size:15px}.cal-d{font-size:12px;color:var(--muted)}.cal-n{font-size:11px;color:var(--muted)}
.cal-empty{background:transparent;border-style:dashed;opacity:.4}.cal-wk{background:var(--surface-2)}
@media (max-width:600px){.cal-c{min-height:54px;padding:3px}.cal-c b{font-size:12px}.cal-n{display:none}}
.theme-seg{display:flex;width:100%}
.theme-seg button{flex:1;border:0;border-right:1px solid var(--line);background:none;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.theme-seg button:last-child{border-right:0}
.theme-seg button[aria-checked="true"]{background:var(--surface-2);color:var(--ink)}
@media (max-width:860px){.me .theme-seg{width:auto;flex:none}}
:root[data-theme="dark"] .clock{background:linear-gradient(135deg,#1a1f2e,#0b0d14);color:#E9E3D4;border:1px solid #3a3220}
.clock{background:linear-gradient(135deg,#1b1810,#3a2e12);color:#f6f3ea}
h1,.pagehead h1{font-family:var(--font-display);font-weight:700}
.btn.primary{background:linear-gradient(180deg,#F2CE72,#D9A93E);border-color:#D9A93E;color:#141006}
.mark{background:none!important;width:42px;height:42px}.mark img{width:42px;height:42px;display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
#toast:empty{display:none}

  const hist = (i.history || []).map(h => Object.assign({}, h)); hist.push(histEntry(i.desk, role, action));
  await ideaRef(i.id).update(Object.assign({}, data, { history: hist, updatedAt: new Date().toISOString() }));
}

/* ---------- render ---------- */
function render(force) {
  const a = document.activeElement;
  if (!force && a && $("#root").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { S.pending = true; return; }
  S.pending = false;
  if (S.phase !== "ready") { $("#root").innerHTML = gateView(); return; }
  const flagsOpen = openFlags().filter(f => f.level !== "amber").length;
  const awaiting = S.ideas.filter(i => effStatus(i) === "handed_over").length;
  const nav = VIEWS.filter(v => v[0] !== "team" || isAdmin()).map(([k, l]) => {
    let badge = "";
    if (k === "today" && flagsOpen) badge = `<span class="count red" title="Market-moving news">${flagsOpen}</span>`;
    if (k === "desk" && awaiting) badge = `<span class="count" title="Awaiting technical review">${awaiting}</span>`;
    if (k === "trades" && liveTrades().length) badge = `<span class="count">${liveTrades().length}</span>`;
    if (SOON[k]) badge = `<span class="soon">${SOON[k]}</span>`;
    return `<button data-act="view" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${l}${badge}</button>`;
  }).join("");
  let body = S.loadNote ? `<div class="note warn">${esc(S.loadNote)}</div>` : "";
  body += ({ today: viewToday, desk: viewDesk, trades: viewTrades, journal: viewJournal, log: viewLog, picks: viewPicks, show: viewShow, forecast: viewForecast, help: viewHelp, team: viewTeam }[S.view] || viewToday)();
  body += `<p class="foot">Private to Leago Rifumo Capital staff. Every action is recorded with your name. Research and trading notes, not financial advice.</p>`;
  $("#root").innerHTML = `<div class="shell"><aside class="side"><div class="brand"><div class="mark" aria-hidden="true"><img src="assets/img/monogram.png" alt=""></div><div><b>LRC Workplace</b><span>Leago Rifumo Capital</span></div></div>
    <nav class="nav" aria-label="Workplace">${nav}</nav>
    <div class="me">${themeSwitch()}<span>Signed in as <b>${esc(myName())}</b>${isAdmin() ? " · admin" : ""}</span><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn ghost sm" data-act="chpw">Change password</button><button class="btn ghost sm" data-act="signout">Sign out</button></div></div></aside>
    <main><div class="stack">${body}</div></main></div>`;
  if (S.view === "show" && S._thumb) { drawThumb($("#thumbprev"), S._thumb); if (document.fonts && !S._fontsOk) document.fonts.ready.then(() => { S._fontsOk = true; if (S.view === "show") drawThumb($("#thumbprev"), S._thumb); }); }
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending && !$("#modal").innerHTML) render(); }, 0));

/* ---------- sign in ---------- */
const gateWrap = inner => `<div class="gate"><div class="panel"><div class="brand" style="padding:0"><div class="mark" aria-hidden="true"><img src="assets/img/monogram.png" alt=""></div><div><b>LRC Workplace</b><span>Leago Rifumo Capital · staff only</span></div></div>${inner}</div></div>`;
function gateView() {
  if (S.phase === "loading" || !S.phase) return gateWrap(`<p class="subtle">Opening the Workplace…</p>`);
  if (S.phase === "error") return gateWrap(`<h1>Can't open the Workplace</h1><p class="subtle">${esc(S.loadNote || "")}</p><button class="btn" data-act="signout">Sign out</button>`);
  if (S.phase === "notstaff") return gateWrap(`<h1>Not on the staff list</h1><p class="subtle">You're signed in, but this account isn't on the LRC staff list yet. Ask the admin to add you on the Team page.</p><button class="btn" data-act="signout">Sign out</button>`);
  return gateWrap(`<h1>Sign in</h1><p class="subtle">Use the username and password the admin gave you, e.g. <span class="mono">prayer.nkuna</span>.</p>
    <form data-form="signin"><div class="field"><label for="g-name">Username</label><input type="text" id="g-name" name="name" required autocomplete="username" autocapitalize="none" value="${esc(S.sessionName || "")}"></div>
    <div class="field"><label for="g-pw">Password</label><input type="password" id="g-pw" name="pw" required autocomplete="current-password"></div>
    <p class="note bad form-error" id="g-err"></p><button class="btn primary" type="submit">Sign in</button></form>
    <p class="subtle" style="margin:0">Forgotten your password? Ask the admin to set a temporary one.</p>`);
}
async function onGate(f) {
  const err = $("#g-err"); err.textContent = "";
  try {
    const { error } = await S.sb.auth.signInWithPassword({ email: userEmail(f.name.value), password: f.pw.value });
    if (error) { err.textContent = /invalid/i.test(error.message) ? "That username and password don't match. Check both and try again." : error.message; f.pw.value = ""; f.pw.focus(); return; }
    await afterSignIn();
  } catch (e) { err.textContent = "Couldn't reach the sign-in service. Check your connection."; }
}
function pwForm() {
  openModal({ title: "Change your password", body: `${fld("np", "New password", `<input type="password" id="np" name="np" minlength="8" required autocomplete="new-password">`, "At least 8 characters, not used anywhere else.")}${fld("np2", "Confirm", `<input type="password" id="np2" name="np2" required autocomplete="new-password">`)}`,
    buttons: `<button class="btn primary" type="submit">Change password</button>`,
    onSubmit: async form => { if (form.np.value.length < 8) return "Use at least 8 characters."; if (form.np.value !== form.np2.value) return "The passwords don't match.";
      const { error } = await S.sb.auth.updateUser({ password: form.np.value }); if (error) return error.message; toast("Password changed."); } });
}

/* ---------- Today ---------- */
function viewToday() {
  const mc = marketClock(), now = new Date();
  let headline = "", sub = "";
  if (mc.isOpen) { headline = dur(mc.close - now); sub = `US market open · closes ${fmtT(mc.close)} SA time`; }
  else { headline = dur(mc.open - now); sub = `to the US open · ${mc.open.toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "short", timeZone: SA })}`; }
  const flags = openFlags(), red = flags.filter(f => f.level !== "amber"), amber = flags.filter(f => f.level === "amber");
  const lt = liveTrades(), hot = lt.filter(i => flagsFor(i).some(f => f.level !== "amber"));
  const newsBox = red.length
    ? `<div class="redbox"><h2>Market-moving news · ${red.length}</h2>${red.slice(0, 4).map(flagCard).join("")}${red.length > 4 ? `<button class="btn sm" data-act="view" data-v="trades">See all ${red.length}</button>` : ""}</div>`
    : `<div class="calm"><h2 style="font-size:18px">No market-moving news flagged</h2><p class="subtle" style="margin:6px 0 0">The news scan marks anything that hits an active trade or the US and SA markets here, in red.${amber.length ? ` ${amber.length} lower-priority item${amber.length > 1 ? "s" : ""} on Active trades.` : ""}</p></div>`;
  const awaiting = S.ideas.filter(i => effStatus(i) === "handed_over").length;
  const approved = S.ideas.filter(i => i.status === "approved").length;
  return `<div class="pagehead"><div><h1>${now.toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "long", timeZone: SA })}</h1><p>Good ${now.getHours() < 12 ? "morning" : now.getHours() < 17 ? "afternoon" : "evening"}, ${esc(myName().split(" ")[0])}. Here's the desk.</p></div></div>
  <div class="hero">
    <div class="clock"><div class="lab">US PM session</div><div class="big" id="cd">${headline}</div><div class="lab">${sub}</div>
      <div class="times"><div><span>US open</span><b>${fmtT(mc.open)}</b></div><div><span>Show ready</span><b>${fmtT(mc.ready)}</b></div><div><span>Leago Rifumo Show</span><b>${fmtT(mc.live)}</b></div></div>
      <div class="lab">SA time. Moves with US daylight saving; US holidays aren't counted.</div></div>
    ${newsBox}
  </div>
  <div class="tiles">
    <button class="tile" data-act="view" data-v="trades"><span>Active trades</span><b>${lt.length}</b><small>${hot.length ? `<span class="neg">${hot.length} hit by news</span>` : "none hit by news"}</small></button>
    <button class="tile" data-act="view" data-v="desk"><span>Awaiting technical</span><b>${awaiting}</b><small>handovers to review</small></button>
    <button class="tile" data-act="view" data-v="desk"><span>Approved, not filled</span><b>${approved}</b><small>ready for the trader</small></button>
    <button class="tile" data-act="view" data-v="picks"><span>Top picks</span><b>${S.edition ? Object.keys(S.picks).length : "—"}</b><small>${S.edition ? "edition " + fmtDate(S.edition.date) : "first edition 12:47"}</small></button>
  </div>
  ${lt.length ? `<h2 style="font-size:19px">Active trades</h2><div class="tblwrap">${tradesTable(lt)}</div>` : ""}`;
}
function flagCard(f) {
  return `<div class="flag ${f.level === "amber" ? "amber" : ""} ${f.cleared ? "cleared" : ""}"><div class="flag-h">${f.level === "amber" ? `<span class="pill warn">Watch</span>` : `<span class="pill red">Market-moving</span>`}
    ${(f.assets || []).map(a => `<b>${esc(a)}</b>`).join(" ")}<span class="subtle">${ago(f.at)}</span></div>
    <p><strong>${esc(f.headline)}</strong></p>${f.detail ? `<p>${esc(f.detail)}</p>` : ""}
    ${f.action ? `<p><span class="subtle">Suggested action:</span> ${esc(f.action)}</p>` : ""}
    <div class="flag-h">${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener" class="subtle">${esc(f.source || "Source")}</a>` : `<span class="subtle">${esc(f.source || "")}</span>`}
    ${f.cleared ? `<span class="subtle">Reviewed by ${esc(f.cleared.byName)} · ${fmtDT(f.cleared.at)}</span>` : `<button class="btn sm" data-act="clearflag" data-id="${f.id}" ${S.readOnly ? "disabled" : ""}>Mark as reviewed</button>`}</div></div>`;
}
function tradesTable(list) {
  return `<table><thead><tr><th>Asset</th><th>Desk</th><th>Side</th><th class="num">Entry</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Last</th><th class="num">Open R</th><th>News</th></tr></thead><tbody>
  ${list.map(i => { const m = S.marks[i.id], r = m ? rMultiple(i, num(m.price)) : null, fl = flagsFor(i), redF = fl.some(f => f.level !== "amber");
    return `<tr><td class="mono"><b>${esc(i.fund.asset)}</b></td><td>${DESKS[i.desk].short}</td><td>${biasPill(i.fund.bias)}</td><td class="num">${fmtP(i.exec ? i.exec.fill : i.tech.entry)}</td><td class="num">${fmtP(i.tech.stop)}</td><td class="num">${fmtP(i.tech.target)}</td>
      <td class="num">${m ? fmtP(m.price) : "—"}</td><td class="num ${r > 0 ? "pos" : r < 0 ? "neg" : ""}">${fmtR(r)}</td><td>${redF ? `<span class="pill red">Market-moving</span>` : fl.length ? `<span class="pill warn">Watch</span>` : `<span class="subtle">Clear</span>`}</td></tr>`; }).join("")}</tbody></table>`;
}

/* ---------- Active trades ---------- */
function viewTrades() {
  const lt = liveTrades().slice().sort((a, b) => flagsFor(b).length - flagsFor(a).length);
  const ff = S.flagFilter, fl = ff === "open" ? openFlags() : S.flags.slice(0, 60);
  const cards = lt.map(i => {
    const m = S.marks[i.id], price = m ? num(m.price) : null, r = price != null ? rMultiple(i, price) : null;
    const tr = rMultiple(i, i.tech.target), fls = flagsFor(i), redF = fls.some(f => f.level !== "amber");
    const lo = -1, hi = Math.max(tr || 2, 1), pos = r == null ? null : Math.min(100, Math.max(0, (r - lo) / (hi - lo) * 100)), zero = (0 - lo) / (hi - lo) * 100;
    return `<article class="idea t-live ${redF ? "hot" : ""}"><div class="idea-h"><span class="asset">${esc(i.fund.asset)}</span>${biasPill(i.fund.bias)}<span class="pill outline">${DESKS[i.desk].short}</span>
      ${i.verdict && i.verdict.size ? `<span class="pill ${i.verdict.size === "Full size" ? "buy" : "warn"}">${esc(i.verdict.size)}</span>` : ""}${redF ? `<span class="pill red">Market-moving news</span>` : ""}</div>
      <div class="idea-meta"><span>Filled at <b class="mono">${fmtP(i.exec && i.exec.fill)}</b> on ${fmtDate(i.exec && i.exec.date)}</span>${m ? `<span>Last <b class="mono">${fmtP(m.price)}</b> · ${ago(m.at)}${m.source ? " · " + esc(m.source) : ""}</span>` : `<span>No price update yet</span>`}</div>
      <div style="padding:0 16px 12px"><div class="levels"><div><span>Stop</span><b>${fmtP(i.tech.stop)}</b></div><div><span>Entry</span><b>${fmtP(i.exec ? i.exec.fill : i.tech.entry)}</b></div><div><span>Target</span><b>${fmtP(i.tech.target)}</b></div><div><span>Open result</span><b class="${r > 0 ? "pos" : r < 0 ? "neg" : ""}">${fmtR(r)}</b></div></div>
      ${pos != null ? `<div class="meter" aria-label="Open result ${fmtR(r)} between stop at -1R and target at ${fmtR(tr)}"><em style="left:${zero}%"></em><i style="left:${pos}%"></i></div><div class="meterlab"><span>Stop −1R</span><span>Entry</span><span>Target ${fmtR(tr)}</span></div>` : ""}</div>
      ${fls.length ? `<div style="padding:0 16px 14px" class="stack">${fls.map(flagCard).join("")}</div>` : ""}
      <div class="idea-f"><span class="subtle">Setup invalid if: ${esc(i.tech.invalidation || "—")}</span><div class="acts">${S.role[i.desk] === "tech" ? `<button class="btn sm primary" data-act="close" data-id="${i.id}" ${S.readOnly ? "disabled" : ""}>Close trade</button>` : ""}<button class="btn sm" data-act="jnote" data-id="${i.id}" ${S.readOnly ? "disabled" : ""}>Journal note</button><button class="btn sm" data-act="mark" data-id="${i.id}" ${S.readOnly ? "disabled" : ""}>Update price</button></div></div></article>`;
  }).join("");
  const L = LIM(), shorts = lt.filter(x => x.fund.bias === "Sell").length, secs = {}; lt.forEach(x => { const k = sectorOf(x); secs[k] = (secs[k] || 0) + 1; });
  const meter = (label, n, max) => `<div class="tile"><span>${label}</span><b class="${n >= max ? "neg" : ""}">${n} / ${max}</b><div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px"><div style="height:100%;border-radius:3px;width:${Math.min(100, n / max * 100)}%;background:${n >= max ? "var(--sell)" : n >= max - 1 ? "var(--warn)" : "var(--buy)"}"></div></div></div>`;
  const riskPanel = `<div class="tiles">${meter("Open trades", lt.length, L.maxTrades)}${meter("Open shorts", shorts, L.maxShorts)}<div class="tile" style="grid-column:span 2"><span>By sector (limit ${L.maxPerSector} each)</span><div class="checks" style="margin-top:6px">${Object.keys(secs).length ? Object.entries(secs).map(([k, n]) => `<span class="pill ${n >= L.maxPerSector ? "sell" : "outline"}">${esc(k)} · ${n}</span>`).join("") : `<span class="subtle">No open trades.</span>`}</div></div></div>
  ${lt.filter(eventSoon).map(x => { const e = eventSoon(x); return `<div class="note warn"><b>${esc(x.fund.asset)}</b>: ${esc(e.what)} on ${fmtDate(e.date)}, in ${e.days} days. Event risk on an open trade.</div>`; }).join("")}`;
  return `<div class="pagehead"><div><h1>Active trades</h1><p>Every handover marked as filled lands here. The news scan checks them hourly from 06:00 to 22:00 and turns a trade red when market-moving news hits it.</p></div></div>
  ${riskPanel}
  ${lt.length ? `<div class="stack">${cards}</div>` : `<div class="empty">No active trades. A trade appears here as soon as the technical desk marks an approved handover as filled.</div>`}
  <div class="deskbar"><h2 style="font-size:19px">News flags</h2><div class="filters">${[["open", "Open"], ["all", "All recent"]].map(([k, l]) => `<button class="chip" aria-pressed="${ff === k}" data-act="flagfilter" data-f="${k}">${l}</button>`).join("")}</div></div>
  ${fl.length ? `<div class="stack">${fl.map(flagCard).join("")}</div>` : `<div class="empty">${ff === "open" ? "No open news flags." : "No news flags yet."}</div>`}`;
}

/* ---------- Handover desk ---------- */
function viewDesk() {
  const desk = S.desk;
  const deskTabs = `<div class="filters" role="group" aria-label="Desk">${Object.keys(DESKS).map(k => `<button class="chip" aria-pressed="${desk === k}" data-act="desk" data-d="${k}">${DESKS[k].name}</button>`).join("")}</div>`;
  const head = `<div class="pagehead"><div><h1>Handover desk</h1><p>The fundamental desk hands an idea over; the technical desk approves the setup, waits, or rejects it under LRC rules.</p></div>${deskTabs}</div>`;
  const roles = ["fund", "tech"].filter(r => can(desk, r));
  if (!roles.length) return head + `<div class="empty">You don't have access to the ${DESKS[desk].name}. Ask the admin to add it to your account.</div>`;
  if (!roles.includes(S.role[desk])) S.role[desk] = roles[0];
  const role = S.role[desk];
  const ideas = S.ideas.filter(i => i.desk === desk);
  const cnt = s => ideas.filter(i => effStatus(i) === s).length;
  const stages = [["handed_over", "Awaiting technical", "accent"], ["waiting", "Waiting for setup", "warn"], ["approved", "Approved", "buy"], ["executed", "Active", "live"], ["closed", "Closed", ""], ["no_trade", "No trade", "sell"]];
  const f = S.filter[desk];
  const groups = { active: ["handed_over", "waiting", "approved", "executed", "draft", "watchlist"], closed: ["closed"], dead: ["no_trade", "expired", "withdrawn", "cancelled"],
    all: ["handed_over", "waiting", "approved", "executed", "draft", "watchlist", "closed", "no_trade", "expired", "withdrawn", "cancelled"] }[f];
  let list = "";
  groups.forEach(s => { const items = ideas.filter(i => effStatus(i) === s).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
    if (items.length) list += `<h3 class="group-h">${STATUS[s].label} · ${items.length}</h3>` + items.map(i => card(i, role)).join(""); });
  if (!list) list = `<div class="empty">${!S.ideasLoaded ? "Loading handovers…" : f === "active" ? (role === "fund" ? "No open ideas. Start one with <b>New handover</b>." : "Nothing has been handed over yet.") : "Nothing here yet."}</div>`;
  return head + `<div class="deskbar"><div class="who"><span class="subtle">Acting as</span>${roles.length > 1 ? `<div class="filters">${roles.map(r => `<button class="chip" aria-pressed="${role === r}" data-act="role" data-r="${r}">${ROLE_NAME[r]}</button>`).join("")}</div>` : `<span class="pill accent">${ROLE_NAME[role]}</span>`}</div>
    ${role === "fund" ? `<button class="btn primary" data-act="new" ${S.readOnly ? "disabled" : ""}>New handover</button>` : ""}</div>
  <div class="pipeline">${stages.map(([s, l, t]) => `<div class="stage ${t}"><b>${cnt(s)}</b><span>${l}</span></div>`).join("")}</div>
  <div class="filters" role="group" aria-label="Filter ideas">${[["active", "Open"], ["closed", "Closed trades"], ["dead", "No trade & expired"], ["all", "All"]].map(([k, l]) => `<button class="chip" aria-pressed="${f === k}" data-act="filter" data-f="${k}">${l}</button>`).join("")}</div>
  <div class="stack">${list}</div>`;
}
function kv(pairs) { return `<dl class="kv">${pairs.filter(p => p[1] != null && p[1] !== "").map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join("")}</dl>`; }
function biasPill(b) { return b ? `<span class="pill ${b === "Buy" ? "buy" : b === "Sell" ? "sell" : ""}">${esc(b)}</span>` : ""; }
function confPill(c, who) { return c ? `<span class="pill outline">${who} ${esc(c)}</span>` : ""; }
function verdictBox(v) {
  if (!v) return "";
  const cls = v.status === "approved" ? "ok" : v.status === "waiting" ? "wait" : "no";
  const head = v.status === "approved" ? `Approved · ${esc(v.size)}` : v.status === "waiting" ? "Waiting for a setup" : "No trade";
  return `<div class="verdict ${cls}"><strong>${head}</strong>${v.reasons && v.reasons.length ? `<ul>${v.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}</div>`;
}
function card(i, role) {
  const st = effStatus(i), meta = STATUS[st], f = i.fund || {}, t = i.tech, desk = i.desk;
  let expTxt = "";
  if (i.expiry && isActiveStatus(i.status)) { const d = daysUntil(i.expiry); expTxt = d < 0 ? `Bias expired ${fmtDate(i.expiry)}` : d === 0 ? "Bias expires today" : `Bias expires in ${d} day${d === 1 ? "" : "s"}`; }
  const fundExtra = desk !== "eq" ? kv([["Horizon", esc(f.horizon)], ["Event risk", f.eventRisk ? esc(f.eventRisk) + (f.eventDate ? ` · ${fmtDate(f.eventDate)}` : "") : ""]])
    : kv([["Company", esc([f.company, f.exchange].filter(Boolean).join(" · "))], ["Sector", esc(f.sector)], ["Work-sheet", f.wsRating ? esc(f.wsRating) + (f.wsScore != null ? ` · score ${f.wsScore}` : "") + (f.wsClear ? ` · ${esc(f.wsClear)}` : "") + (f.wsLink ? ` · <a href="${esc(f.wsLink)}" target="_blank" rel="noopener">open</a>` : "") : ""], ["Valuation", esc(f.valuation)],
      ["Fair value vs price", f.fairValue && f.price ? `<span class="mono">${fmtP(f.fairValue)} / ${fmtP(f.price)}</span> (${((f.fairValue / f.price - 1) * 100).toFixed(1)}%)` : ""],
      ["Catalyst", f.catalyst ? esc(f.catalyst) + (f.catalystDate ? ` · ${fmtDate(f.catalystDate)}` : "") : ""], ["Horizon", esc(f.horizon)]]);
  const drivers = (f.drivers || []).length ? `<div class="checks">${f.drivers.map(d => `<span class="pill outline">${esc(d)}</span>`).join("")}</div>` : "";
  const fundHalf = `<div class="half"><h3>Fundamental handover</h3><p class="thesis">${esc(f.thesis)}</p>${drivers}${fundExtra}${f.invalidation ? `<div><div class="subtle">Bias changes if</div><p class="thesis">${esc(f.invalidation)}</p></div>` : ""}</div>`;
  let techHalf;
  if (!t) {
    const msg = { draft: "Locked. The technical desk opens once this idea is handed over.", watchlist: "Locked. Low-confidence ideas stay on the watchlist and can't be handed over.",
      handed_over: "Handed over. Waiting for the technical desk to review the setup.", expired: "The bias expired before a technical review. The fundamental desk can renew it or withdraw it.", withdrawn: "Withdrawn before a technical review." }[st] || "No technical review.";
    techHalf = `<div class="half"><h3>Technical execution</h3><div class="locked">${msg}</div></div>`;
  } else if (t.setup === WAIT) {
    techHalf = `<div class="half"><h3>Technical execution</h3>${verdictBox(i.verdict)}${kv([["Timeframe", esc(t.timeframe)], ["Reviewed", fmtDT(t.at)]])}${t.thesis ? `<p class="thesis">${esc(t.thesis)}</p>` : ""}</div>`;

      $("#techmain").querySelectorAll("select,input").forEach(el => { if (["timeframe", "trend", "tconf", "session", "volume", "entry", "stop", "target"].includes(el.name)) el.required = !wait; }); form.tthesis.required = !wait;
      const t2 = collect(form), ready = t2.setup && (wait || (t2.bias && t2.conf && t2.trend && t2.entry != null && t2.stop != null && t2.target != null));
      if (!ready) { $("#vbox").innerHTML = `<div class="note">The decision appears here once the setup, bias, confidence, trend and levels are filled in.</div>`; return; }
      const v = verdictOf(f, t2); $("#vbox").innerHTML = `<div class="lbl" style="font-size:13px;font-weight:600;margin-bottom:5px">Decision under LRC rules</div>` + verdictBox(v);
      $("#b-sub").textContent = v.status === "approved" ? "Approve trade" : v.status === "waiting" ? "Mark as waiting" : "Record as no trade"; },
    onSubmit: async form => {
      if (effStatus(i) === "expired") return "This bias has expired. The fundamental desk must renew it first.";
      const t2 = collect(form), v = verdictOf(f, t2), tech = Object.assign({}, t2, { rr: v.rr ?? null, at: new Date().toISOString(), by: S.me, byName: myName() });
      Object.keys(tech).forEach(k => tech[k] === undefined && delete tech[k]);
      const action = v.status === "approved" ? `Technical approved · ${v.size}` : v.status === "waiting" ? "Technical: no setup yet, waiting" : "Technical review: no trade";
      try { await patchIdea(i, { tech, verdict: { status: v.status, size: v.size || null, reasons: v.reasons, codes: v.codes }, status: v.status }, action, "tech"); toast(action + "."); } catch (e) { return writeErr(e); } } });
}
const EMOTIONS = ["Calm", "Confident", "Patient", "Anxious", "Fearful", "Greedy", "FOMO", "Frustrated", "Tired"];
const MISTAKES = ["Entered early", "Chased the entry", "No stop / moved stop", "Size too big", "Exited too early", "Held past the stop", "Ignored news / event risk", "Revenge trade", "Off-plan trade"];
const PRECHECK = ["Entry on the planned trigger", "Stop in place at entry", "Size = 1% risk", "No results or big event within 14 days", "Sector limit (max 2) respected"];
function execForm(i) {
  openModal({ title: `Mark ${esc(i.fund.asset)} as filled`, wide: true, body: `<p class="subtle" style="margin:0">The trade moves to Active trades, the news scan starts watching it, and its journal opens.</p><div class="row3">${fld("fill", "Fill price", `<input type="number" step="any" min="0" id="fill" name="fill" class="mono" value="${esc(i.tech.entry)}" required>`)}${fld("fdate", "Fill date", `<input type="date" id="fdate" name="fdate" value="${today()}" required>`)}${fld("risk", "Risk on this trade (% of account)", `<input type="number" step="0.1" min="0" max="5" id="risk" name="risk" value="1" required>`, "House rule: 1%.")}</div>
    <div class="field"><span class="lbl">Pre-trade checklist</span>${checks("pre", PRECHECK, [])}</div>
    <div class="row2">${fld("emo", "How do you feel going in?", sel("emo", EMOTIONS, "Calm"))}${fld("why", "Why now (one or two lines)", inp("why", "", `maxlength="300" placeholder="e.g. Retest held at 412 on volume; trigger hit at the open."`))}</div><div id="limbox"></div>`,
    onInput: form => { const lc = limitCheck(i, num(form.risk.value)); $("#limbox").innerHTML = (lc.hard.length ? `<div class="note bad"><b>Blocked by LRC risk rules:</b><br>${lc.hard.map(esc).join("<br>")}</div>` : `<div class="note good">Within LRC risk limits (${esc(lc.sec)}).</div>`) + (lc.warn.length ? `<div class="note warn" style="margin-top:6px">${lc.warn.map(esc).join("<br>")}</div>` : ""); },
    buttons: `<button class="btn primary" type="submit">Mark as filled</button>`,
    onSubmit: async form => { const lc = limitCheck(i, num(form.risk.value)); if (lc.hard.length) return "Blocked by LRC risk rules: " + lc.hard.join(" ");
      const pre = [...form.querySelectorAll("input[name=pre]:checked")].map(x => x.value);
      const journal = Object.assign({}, i.journal || {}, { opened: { at: new Date().toISOString(), byName: myName(), risk: num(form.risk.value), checklist: pre, missed: PRECHECK.filter(x => !pre.includes(x)), emotion: form.emo.value, why: form.why.value.trim() }, notes: (i.journal && i.journal.notes) || [] });
      try { await patchIdea(i, { status: "executed", exec: { fill: num(form.fill.value), date: form.fdate.value }, journal }, `Filled at ${form.fill.value}`, "tech"); toast(`${i.fund.asset} is now an active trade. Its journal is open.`); } catch (e) { return writeErr(e); } } });
}
function noteForm(i) {
  openModal({ title: `Journal note · ${esc(i.fund.asset)}`, body: `${fld("jn", "What happened / what you're thinking", area("jn", "", `required maxlength="800" placeholder="e.g. Moved stop to breakeven after 1R as per plan. Volume fading into lunch."`))}${fld("jemo", "Mood right now", sel("jemo", EMOTIONS, "Calm"))}`,
    buttons: `<button class="btn primary" type="submit">Add note</button>`,
    onSubmit: async form => { const m = i.status === "executed" && S.marks[i.id] ? num(S.marks[i.id].price) : null; const j = Object.assign({}, i.journal || {}); j.notes = (j.notes || []).concat([{ at: new Date().toISOString(), byName: myName(), text: form.jn.value.trim(), emotion: form.jemo.value, openR: m != null ? Math.round(rMultiple(i, m) * 100) / 100 : null }]);
      try { await patchIdea(i, { journal: j }, "Journal note added", i.status === "executed" ? "tech" : ""); toast("Note added to the journal."); } catch (e) { return writeErr(e); } } });
}
const reviewFields = (rv = {}) => `<div class="row3">${fld("fp", "Did you follow the plan?", sel("fp", ["Yes", "Partly", "No"], rv.followedPlan))}${fld("remo", "Main emotion during the trade", sel("remo", EMOTIONS, rv.emotion))}${fld("grade", "Grade the execution", sel("grade", ["A – textbook", "B – good", "C – sloppy", "D – broke the rules"], rv.grade))}</div>
  <div class="field"><span class="lbl">Mistakes (tick any)</span>${checks("mist", MISTAKES, rv.mistakes || [])}</div>
  ${fld("lesson", "Lesson to repeat or fix", area("lesson", rv.lesson || "", `maxlength="600" style="min-height:60px" placeholder="One concrete lesson."`))}`;
const readReview = form => ({ followedPlan: form.fp.value, emotion: form.remo.value, grade: form.grade.value, mistakes: [...form.querySelectorAll("input[name=mist]:checked")].map(x => x.value), lesson: form.lesson.value.trim(), at: new Date().toISOString(), byName: myName() });
function reviewForm(i) {
  openModal({ title: `Review · ${esc(i.fund.asset)} (${fmtR(i.close && i.close.r)})`, wide: true, body: reviewFields((i.close && i.close.review) || {}), buttons: `<button class="btn primary" type="submit">Save review</button>`,
    onSubmit: async form => { try { await patchIdea(i, { close: Object.assign({}, i.close, { review: readReview(form) }) }, "Trade review saved", ""); toast("Review saved."); } catch (e) { return writeErr(e); } } });
}
function markForm(i) {
  openModal({ title: `Update ${esc(i.fund.asset)} price`, body: `<p class="subtle" style="margin:0">The news scan updates prices hourly. Use this to put in a fresher price from your broker.</p><div class="row2">${fld("mp", "Last price", `<input type="number" step="any" min="0" id="mp" name="mp" class="mono" required>`)}${fld("ms", "Source", inp("ms", "Broker", `required`))}</div>`,
    buttons: `<button class="btn primary" type="submit">Save price</button>`,
    onSubmit: async form => { try { await S.db.doc("marks/" + i.id).set({ asset: i.fund.asset, price: num(form.mp.value), source: form.ms.value.trim() + " · " + myName(), at: new Date().toISOString() }); toast("Price updated."); } catch (e) { return writeErr(e); } } });
}
function closeForm(i) {
  openModal({ title: `Close ${esc(i.fund.asset)} trade`, body: `<div class="row2">${fld("exit", "Exit price", `<input type="number" step="any" min="0" id="exit" name="exit" class="mono" required>`)}${fld("xdate", "Exit date", `<input type="date" id="xdate" name="xdate" value="${today()}" required>`)}</div>
      <div class="row2">${fld("xwhy", "Why did you exit?", sel("xwhy", ["Target hit", "Stop hit", "Trailing stop", "Setup invalidated", "News / event", "Time stop", "Discretionary"], ""))}<div id="rprev" class="note" style="align-self:end">Enter the exit price to see the result in R.</div></div>
      ${reviewFields({})}${fld("cnotes", "Notes", area("cnotes", "", `maxlength="800" style="min-height:60px" placeholder="What worked, what didn't."`))}`, wide: true,
    buttons: `<button class="btn primary" type="submit">Close trade</button>`,
    onInput: form => { const r = rMultiple(i, num(form.exit.value)); $("#rprev").textContent = r == null ? "Enter the exit price to see the result in R." : `Result: ${fmtR(r)} (${r > 0.05 ? "Win" : r < -0.05 ? "Loss" : "Breakeven"})`; },
    onSubmit: async form => { const exit = num(form.exit.value), r = rMultiple(i, exit); if (r == null) return "The result can't be worked out from these prices. Check the exit price.";
      const result = r > 0.05 ? "Win" : r < -0.05 ? "Loss" : "Breakeven";
      try { await patchIdea(i, { status: "closed", close: { exit, date: form.xdate.value, r: Math.round(r * 100) / 100, result, notes: form.cnotes.value.trim(), exitReason: form.xwhy.value, review: readReview(form) } }, `Closed ${fmtR(r)} (${result})`, "tech"); toast(`Trade closed: ${fmtR(r)}.`); } catch (e) { return writeErr(e); } } });
}
function extendForm(i) {
  const def = addDays(today(), expiryDays(i.desk));
  openModal({ title: effStatus(i) === "expired" ? "Renew fundamental bias" : "Change bias expiry", body: `<p class="subtle" style="margin:0">Only renew if the fundamental case still stands today.</p>${fld("nexp", "Bias valid until", `<input type="date" id="nexp" name="nexp" min="${today()}" value="${def}" required>`)}`,
    buttons: `<button class="btn primary" type="submit">Save expiry</button>`, onSubmit: async form => { try { await patchIdea(i, { expiry: form.nexp.value }, `Bias valid until ${form.nexp.value}`, "fund"); toast("Expiry updated."); } catch (e) { return writeErr(e); } } });
}
function confirmForm(i, kind) {
  const c = { withdraw: ["Withdraw this handover?", "The technical desk will no longer be able to act on it. Say why for the record.", "Withdraw", "withdrawn", "Withdrawn by fundamental", "fund"],
    cancel: ["Mark as not filled?", "Use this when the entry was never reached or the order was cancelled.", "Mark as not filled", "cancelled", "Not filled", "tech"],
    delete: ["Delete this draft?", "Drafts and watchlist ideas can be deleted. This can't be undone.", "Delete", null, null, "fund"] }[kind];
  openModal({ title: c[0], body: `<p style="margin:0">${c[1]}</p>${kind !== "delete" ? fld("why", "Reason", inp("why", "", `required maxlength="300"`)) : ""}`, buttons: `<button class="btn primary" type="submit">${c[2]}</button>`,
    onSubmit: async form => { try { if (kind === "delete") { await ideaRef(i.id).delete(); toast("Draft deleted."); return; } const why = form.why.value.trim();
      await patchIdea(i, { status: c[3], cancelNote: `${c[4]}: ${why}` }, `${c[4]}: ${why}`, c[5]); toast(c[4] + "."); } catch (e) { return writeErr(e); } } });
}
function confirmSimple(title, text, label, fn) {
  openModal({ title, body: `<p style="margin:0">${text}</p>`, buttons: `<button class="btn primary" type="submit">${label}</button>`, onSubmit: async () => { try { await fn(); } catch (e) { return writeErr(e); } } });
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) { closeModal(); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, i = b.dataset.id ? S.ideas.find(x => x.id === b.dataset.id) : null;
  if (act === "view") { S.view = b.dataset.v; history.replaceState(null, "", "#" + S.view); render(true); window.scrollTo(0, 0); return; }
  if (act === "theme") { THEME = b.dataset.t; try { localStorage.setItem("lrc-theme", THEME); } catch (e) {} applyTheme(); render(true); if (S.view === "show" && S._thumb) drawThumb($("#thumbprev"), S._thumb); return; }
  if (act === "signout") { try { await S.sb.auth.signOut(); } catch (e) {} S.phase = "signin"; S.role = { eq: null, fx: null, cm: null }; saveSession(); location.hash = ""; location.reload(); return; }
  if (act === "gateback") { S.gateMode = null; render(true); return; }
  if (act === "desk") { S.desk = b.dataset.d; render(true); return; }
  if (act === "role") { S.role[S.desk] = b.dataset.r; saveSession(); render(true); return; }
  if (act === "filter") { S.filter[S.desk] = b.dataset.f; render(true); return; }
  if (act === "logdesk") { S.logDesk = b.dataset.f; render(true); return; }
  if (act === "showfilter") { S.showFilter = b.dataset.f; S.showId = null; render(true); return; }
  if (act === "prompter" || act === "stream") { openStage(act, b.dataset.id); return; }
  if (act === "thumb") { thumbModal(b.dataset.id); return; }
  if (act === "st-close") { closeStage(); return; }
  if (act === "st-play") { ST.run = !ST.run; if (ST.run) ST.t0 = ST.t0 || Date.now(); stageRender(); if (ST.run) stageTick(); return; }
  if (act === "st-faster") { ST.speed = Math.min(6, ST.speed + 0.4); return; }
  if (act === "st-slower") { ST.speed = Math.max(0.2, ST.speed - 0.4); return; }
  if (act === "st-next") { ST.i++; stageRender(); return; }
  if (act === "st-prev") { ST.i--; stageRender(); return; }
  if (act === "ptab") { S.picksTab = b.dataset.f; render(true); return; }
  if (act === "openpick") { pickModal(b.dataset.id); return; }
  if (act === "openboard") { boardModal(b.dataset.cls, b.dataset.code); return; }
  if (act === "flagfilter") { S.flagFilter = b.dataset.f; render(true); return; }
  if (act === "new") { fundForm(S.desk); return; }
  if (act === "clearflag") { try { await S.db.doc("flags/" + b.dataset.id).update({ cleared: { by: S.me, byName: myName(), at: new Date().toISOString() } }); toast("Marked as reviewed."); } catch (err) { toast(writeErr(err)); } return; }
  if (act === "csv") { const txt = csvText(); try { await navigator.clipboard.writeText(txt); toast("Log copied. Paste it into Excel or Google Sheets."); }
    catch (err) { openModal({ title: "Copy the log", body: `<textarea style="min-height:240px" class="mono" readonly>${esc(txt)}</textarea>`, buttons: "", onSubmit: async () => {} }); } return; }
  if (act === "deskperm" && isAdmin()) { const st = S.staff[b.dataset.k]; const desks = Object.assign({}, st.desks || {}, { [b.dataset.d]: b.checked });
    try { const { error } = await S.sb.rpc("wp_set_desks", { p_uid: st.uid, p_desks: desks }); if (error) throw error; await loadStaff(); toast("Desk access updated."); render(true); } catch (err) { toast(writeErr(err)); } return; }
  if (act === "reset" && isAdmin()) { const st = S.staff[b.dataset.k];
    openModal({ title: `Temporary password for ${esc(st.name)}`, body: `${fld("tp", "Temporary password", `<input type="text" id="tp" name="tp" minlength="8" required autocomplete="off">`, "Give it to them in person or by phone. They change it after signing in.")}`, buttons: `<button class="btn primary" type="submit">Set password</button>`,
      onSubmit: async form => { const { error } = await S.sb.rpc("wp_reset_password", { p_uid: st.uid, p_password: form.tp.value }); if (error) return writeErr(error); toast("Temporary password set."); } }); return; }
  if (act === "remove" && isAdmin()) { const st = S.staff[b.dataset.k];
    confirmSimple(`Remove ${esc(st.name)}?`, "They will no longer be able to open the Workplace. Their past work stays in the log. You can also delete their sign-in in Supabase → Authentication.", "Remove", async () => { const { error } = await S.sb.rpc("wp_remove_staff", { p_uid: st.uid }); if (error) throw error; await loadStaff(); toast("Removed from the team."); render(true); }); return; }
  if (act === "chpw") { pwForm(); return; }
  if (act === "mark" && i) { markForm(i); return; }
  if (act === "jnote" && i) { noteForm(i); return; }
  if (act === "jreview" && i) { reviewForm(i); return; }
  if (act === "jopen") { S.jOpen = S.jOpen === b.dataset.id ? null : b.dataset.id; render(true); return; }
  if (act === "calm") { S.calMonth = b.dataset.m; render(true); return; }
  if (act === "jfilter") { S.jDesk = b.dataset.f; render(true); return; }
  if (!i) return;
  const role = S.role[i.desk];
  if (act === "edit" && role === "fund") fundForm(i.desk, i);
  else if (act === "handover" && role === "fund") { if (i.fund.conf === "Low") { toast("Low-confidence ideas can't be handed over."); return; }
    try { await patchIdea(i, { status: "handed_over", handedOverAt: new Date().toISOString() }, "Handed over to technical", "fund"); toast(`${i.fund.asset} handed over to the technical desk.`); } catch (err) { toast(writeErr(err)); } }
  else if (act === "review" && role === "tech") techForm(i);
  else if (act === "exec" && role === "tech") execForm(i);
  else if (act === "close" && role === "tech") closeForm(i);
  else if (act === "extend" && role === "fund") extendForm(i);
  else if (act === "withdraw" && role === "fund") confirmForm(i, "withdraw");
  else if (act === "cancel" && role === "tech") confirmForm(i, "cancel");
  else if (act === "delete" && role === "fund") confirmForm(i, "delete");
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "showpick") { S.showId = el.value; render(true); }
  if (el.dataset && el.dataset.act === "fcpick") { S.fcId = el.value; render(true); }
});
document.addEventListener("submit", async e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return; e.preventDefault();
  if (f.dataset.form === "signin") return onGate(f);
  if (f.dataset.form === "addstaff" && isAdmin()) {
    const err = $("#s-err"); err.textContent = ""; const user = f.user.value.trim().toLowerCase().replace(/\s+/g, "."), name = f.name.value.trim().replace(/\s+/g, " ");
    if (!/^[a-z0-9._-]{3,}$/.test(user)) { err.textContent = "Usernames use letters, numbers and dots only, e.g. thabo.mokoena."; return; }
    if (name.length < 3) { err.textContent = "Enter the person's full name."; return; }
    const desks = {}; f.querySelectorAll("input[name=desks]:checked").forEach(x => desks[x.value] = true);
    const { error } = await S.sb.rpc("wp_add_staff", { p_username: user, p_name: name, p_desks: desks, p_admin: false });
    if (error) { err.textContent = error.message; return; }
    await loadStaff(); f.reset(); toast(`${name} added. They sign in as ${user}.`); render(true);
  }
  if (f.dataset.form === "rules" && isAdmin()) {
    const err = $("#r-err"); err.textContent = "";
    const next = Object.assign({}, S.config || {}, { minRR: num(f.minRR.value) || 1.5, eqExpiry: parseInt(f.eqExpiry.value) || 14, fxExpiry: parseInt(f.fxExpiry.value) || 7, cmExpiry: parseInt(f.cmExpiry.value) || 10, riskPct: num(f.riskPct.value) || 1, maxTrades: parseInt(f.maxTrades.value) || 8, maxShorts: parseInt(f.maxShorts.value) || 0, maxPerSector: parseInt(f.maxPerSector.value) || 2, eventDays: parseInt(f.eventDays.value) || 0, requireWS: !!f.requireWS.checked, updatedAt: new Date().toISOString() });
    try { await S.db.doc("config/desks").set(next); toast("Rules saved."); render(true); } catch (x) { err.textContent = writeErr(x); }
  }
});
setInterval(() => { const el = $("#cd"); if (!el || S.view !== "today") return; const mc = marketClock(); el.textContent = dur((mc.isOpen ? mc.close : mc.open) - new Date()); }, 30000);
init();
}
</script>
</body>
