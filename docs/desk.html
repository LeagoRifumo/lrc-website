<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Desk | Leago Rifumo Capital</title>
<meta name="theme-color" content="#07080C">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* LRC Trading Desk — private staff page. Same palette and fonts as the public site (style.css), one dark theme. */
:root{
  --bg:#07080C; --panel:#121622; --panel-2:#181D2B; --line:rgba(217,169,62,.22); --line-soft:#232838;
  --gold:#D9A93E; --gold-2:#F2CE72; --text:#E9E3D4; --muted:#9AA1B2;
  --buy:#3BB97A; --buy-bg:rgba(47,163,107,.16); --sell:#F0645E; --sell-bg:rgba(227,38,43,.15);
  --warn:#E8B64C; --warn-bg:rgba(232,182,76,.14); --live:#7EA7F2; --live-bg:rgba(126,167,242,.15);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --radius:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h2{font:700 30px var(--serif)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

.top{border-bottom:1px solid var(--line);background:#0B0D14}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand img{width:38px;height:38px}
.brand b{display:block;font:700 13px var(--sans);letter-spacing:.24em}
.brand small{display:block;color:var(--gold);font-size:11px;letter-spacing:.3em}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.tab:hover{color:var(--text)}
.count{background:var(--gold);color:#141006;border-radius:99px;font:600 11px var(--mono);padding:1px 7px}
main{padding:32px 0 60px}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{border:1px solid var(--line-soft);background:var(--panel-2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);color:#141006}
.btn.danger{color:var(--sell)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:#0D1018;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,169,62,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;background:#0D1018}
.seg label{flex:1;text-align:center;padding:8px 6px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line-soft);color:var(--muted);position:relative}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--panel-2);color:var(--text)}
.seg label:has(input[value="Buy"]:checked){background:var(--buy-bg);color:var(--buy)}
.seg label:has(input[value="Sell"]:checked){background:var(--sell-bg);color:var(--sell)}
.seg label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:-2px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--gold);background:rgba(217,169,62,.1)}

.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.pill.buy{background:var(--buy-bg);color:var(--buy)} .pill.sell{background:var(--sell-bg);color:var(--sell)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.live{background:var(--live-bg);color:var(--live)}
.pill.accent{background:rgba(217,169,62,.15);color:var(--gold-2)} .pill.outline{background:none;border:1px solid var(--line-soft)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.note{border-radius:8px;padding:10px 14px;font-size:14px;background:var(--panel-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--sell-bg);color:var(--sell)}
.form-error:empty{display:none}
.signin{max-width:460px;margin:24px auto}
.signin form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.subtle{color:var(--muted);font-size:13px}

.deskbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stage{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;border-top:3px solid var(--line-soft)}
.stage b{display:block;font:500 22px var(--mono)} .stage span{font-size:12.5px;color:var(--muted)}
.stage.accent{border-top-color:var(--gold)} .stage.warn{border-top-color:var(--warn)} .stage.buy{border-top-color:var(--buy)}
.stage.live{border-top-color:var(--live)} .stage.sell{border-top-color:var(--sell)}
@media (max-width:820px){.pipeline{grid-template-columns:repeat(3,1fr)}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-soft);background:none;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:#141006;border-color:var(--gold)}
.group-h{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin-top:6px}

.idea{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;border-left:4px solid var(--line-soft)}
.idea.t-accent{border-left-color:var(--gold)} .idea.t-warn{border-left-color:var(--warn)} .idea.t-buy{border-left-color:var(--buy)}
.idea.t-live{border-left-color:var(--live)} .idea.t-sell{border-left-color:var(--sell)}
.idea-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px 4px}
.idea-h .asset{font:500 18px var(--mono);margin-right:4px}
.idea-meta{padding:0 16px 10px;color:var(--muted);font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap}
.halves{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-soft)}
.half{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.half+.half{border-left:1px solid var(--line-soft)}
@media (max-width:760px){.halves{grid-template-columns:1fr}.half+.half{border-left:0;border-top:1px solid var(--line-soft)}}
.half h3{font:600 11.5px var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.thesis{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 14px;margin:0}
.kv div{min-width:0} .kv dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.levels{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.levels div{padding:7px 10px;border-right:1px solid var(--line-soft)} .levels div:last-child{border-right:0}
.levels span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em} .levels b{font:500 14px var(--mono)}
.locked{color:var(--muted);font-size:14px;background:#0D1018;border-radius:8px;padding:14px;border:1px dashed var(--line-soft)}
.verdict{border-radius:8px;padding:10px 12px;font-size:14px}
.verdict.ok{background:var(--buy-bg);color:var(--buy)} .verdict.no{background:var(--sell-bg);color:var(--sell)} .verdict.wait{background:var(--warn-bg);color:var(--warn)}
.verdict ul{margin:6px 0 0;padding-left:18px}
.outcome{padding:10px 16px;border-top:1px solid var(--line-soft);background:#0D1018;font-size:14px;display:flex;gap:6px 16px;flex-wrap:wrap}
.idea-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line-soft)}
.idea-f .acts{display:flex;gap:6px;flex-wrap:wrap}
details.hist summary{cursor:pointer;color:var(--muted);font-size:13px}
details.hist ol{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line-soft);border-radius:var(--radius)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px}
.tile span{font-size:12.5px;color:var(--muted)} .tile b{display:block;font:500 26px var(--mono);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tbl-title{padding:12px 14px 4px;font:700 19px var(--serif)}
.pos{color:var(--buy)} .neg{color:var(--sell)}

#modal:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20}
.dialog{position:fixed;z-index:21;left:50%;top:4vh;transform:translateX(-50%);width:min(640px,calc(100% - 24px));max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.dialog.wide{width:min(820px,calc(100% - 24px))}
.dialog form{display:flex;flex-direction:column;min-height:0}
.dialog header{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog header h2{font-size:24px}
.dialog .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog footer{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.handover-sum{background:#0D1018;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#141006;font-weight:600;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
#toast:empty{display:none}
.foot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line-soft);padding-top:14px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <a class="brand" href="index.html" aria-label="Leago Rifumo Capital home"><img src="assets/img/monogram.png" alt=""><div><b>LEAGO RIFUMO</b><small>TRADING DESK</small></div></a>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Desks"></nav>
  </div>
</header>
<main class="wrap"><div id="app" class="stack"><p class="subtle">Loading…</p></div></main>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="pairs">
  <option value="EUR/USD"></option><option value="GBP/USD"></option><option value="USD/JPY"></option><option value="USD/CHF"></option>
  <option value="AUD/USD"></option><option value="NZD/USD"></option><option value="USD/CAD"></option><option value="USD/ZAR"></option>
  <option value="EUR/ZAR"></option><option value="GBP/ZAR"></option><option value="EUR/GBP"></option><option value="EUR/JPY"></option>
  <option value="GBP/JPY"></option><option value="XAU/USD"></option>
</datalist>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/js/desk.js?v=1.0"></script>
</body>
</html>
